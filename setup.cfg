# pycodestyle is already pinned in the sample requirements files, so this is the
# linter that actually runs here. Black owns formatting; these codes are the
# ones black deliberately disagrees with.
[pycodestyle]
max-line-length = 88
ignore = E203,E501,W503,W504
exclude = .git,__pycache__,migrations,node_modules,.venv,venv,build
